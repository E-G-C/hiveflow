<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "Helvetica Neue", Arial, sans-serif;
      max-width: 900px;
      margin: 2rem auto;
      padding: 0 1rem;
      line-height: 1.6;
      color: #333;
    }
    h1 { border-bottom: 2px solid #2563eb; padding-bottom: 0.5rem; }
    h2 { color: #1e40af; margin-top: 2rem; }
    h3 { color: #1e3a5f; }
    a { color: #2563eb; }
    code {
      background: #f1f5f9;
      padding: 0.1em 0.3em;
      border-radius: 3px;
      font-size: 0.9em;
    }
    pre {
      background: #f1f5f9;
      padding: 1rem;
      border-radius: 6px;
      overflow-x: auto;
    }
    pre code { background: none; padding: 0; }
    table {
      border-collapse: collapse;
      width: 100%;
      margin: 1rem 0;
    }
    th, td {
      border: 1px solid #e2e8f0;
      padding: 0.5rem 0.75rem;
      text-align: left;
    }
    th { background: #f8fafc; font-weight: 600; }
    blockquote {
      border-left: 4px solid #2563eb;
      margin: 1rem 0;
      padding: 0.5rem 1rem;
      background: #eff6ff;
    }
    .metadata {
      color: #64748b;
      font-size: 0.9em;
      margin-bottom: 2rem;
    }
  </style>
</head>
<body>
  {% if metadata %}
  <div class="metadata">
    {% for key, value in metadata.items() %}
    <span>{{ key }}: {{ value }}</span>{% if not loop.last %} | {% endif %}
    {% endfor %}
  </div>
  {% endif %}
  {{ body }}
</body>
</html>
