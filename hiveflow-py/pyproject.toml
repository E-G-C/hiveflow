[project]
name = "hiveflow"
version = "0.1.0"
description = "A reusable, generic multi-agent framework for collaborative LLM workflows"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "HiveFlow Team"}
]
keywords = ["llm", "agents", "multi-agent", "workflow", "research", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Core async and networking
    "httpx>=0.27.0",
    "aiofiles>=24.1.0",
    # LLM providers (core)
    "openai>=1.52.0",
    "anthropic>=0.39.0",
    # Configuration and validation
    "pydantic>=2.9.2",
    "pydantic-settings>=2.6.1",
    "python-dotenv>=1.0.1",
    # JSON parsing resilience
    "json-repair>=0.30.0",
    # Rate limiting and concurrency
    "ratelimit>=2.2.1",
    # Logging and monitoring
    "structlog>=24.4.0",
    "rich>=13.9.4",
    # YAML parsing (for layout templates)
    "pyyaml>=6.0.1",
    # XML parsing safety
    "defusedxml>=0.7.1",
    # Numerical computing (local embeddings, vector ops)
    "numpy>=2.2.0",
]

[project.optional-dependencies]
# API
api = [
    "fastapi>=0.115.5",
    "uvicorn[standard]>=0.32.1",
    "websockets>=14.1",
]

# LLM providers (extended)
llm-azure = [
    "azure-identity>=1.19.0",
]

llm-google = [
    "google-generativeai>=0.8.3",
]

llm-ollama = [
    "ollama>=0.4.4",
]

# Embedding providers
embeddings-openai = [
    "openai>=1.52.0",
]

embeddings-cohere = [
    "cohere>=5.12.1",
]

# Local HuggingFace transformer embeddings
embeddings-huggingface = [
    "sentence-transformers>=3.3.1",
]

# Data processing
retrieval = [
    "duckduckgo-search>=7.1.0",
    "tavily-python>=0.5.0",
    "arxiv>=2.1.3",
]

scraping = [
    "beautifulsoup4>=4.12.3",
    "playwright>=1.49.1",
    "pymupdf>=1.25.2",
]

documents = [
    "python-docx>=1.1.2",
    "python-pptx>=1.0.2",
    "pandas>=2.2.3",
    "openpyxl>=3.1.5",
]

documents-azure = [
    "azure-storage-blob>=12.20.0",
    "aiohttp>=3.9.0",
]

# Universal document conversion via MarkItDown
markitdown = [
    "markitdown>=0.1.0",
]

# Publishing
publishers = [
    "pypandoc>=1.14",
    "pypandoc_binary>=1.14",
    "jinja2>=3.1.4",
]

# Context compression and vector store
embeddings = [
    "numpy>=2.2.0",
    "scikit-learn>=1.6.0",
]

# MCP (Model Context Protocol) integration
mcp = [
    "mcp>=1.26.0",
]

# Observability (optional)
observability = [
    "opentelemetry-api>=1.27.0",
]

# Development tools
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.8.4",
    "mypy>=1.13.0",
    "pre-commit>=4.0.1",
]

# All optional dependencies
all = [
    "hiveflow[api,llm-azure,llm-google,llm-ollama,retrieval,scraping,documents,documents-azure,markitdown,publishers,embeddings,embeddings-huggingface,mcp,observability]",
]

[project.entry-points."hiveflow.tools"]
document_retriever = "hiveflow.plugins.tools.document_retriever:DocumentRetrieverTool"

[project.entry-points."hiveflow.skills"]
# Skills are discovered via filesystem by default.
# Entry points allow pip-installable skill packages to register
# a Path to their skill directories.

[project.entry-points."hiveflow.llm"]
openai = "hiveflow.plugins.llm.openai_provider:OpenAIProvider"
anthropic = "hiveflow.plugins.llm.anthropic_provider:AnthropicProvider"
azure = "hiveflow.plugins.llm.azure_provider:AzureOpenAIProvider"
perplexity = "hiveflow.plugins.llm.perplexity_provider:PerplexityProvider"

[project.entry-points."hiveflow.retrievers"]
tavily = "hiveflow.plugins.retrievers.tavily_retriever:TavilyRetriever"
duckduckgo = "hiveflow.plugins.retrievers.duckduckgo_retriever:DuckDuckGoRetriever"

[project.entry-points."hiveflow.scrapers"]
beautifulsoup = "hiveflow.plugins.scrapers.bs4_scraper:BS4Scraper"
playwright = "hiveflow.plugins.scrapers.playwright_scraper:PlaywrightScraper"

[project.entry-points."hiveflow.embeddings"]
huggingface = "hiveflow.plugins.embeddings.huggingface_embeddings:HuggingFaceEmbeddingProvider"
local = "hiveflow.plugins.embeddings.local_embeddings:LocalEmbeddingProvider"
openai = "hiveflow.plugins.embeddings.openai_embeddings:OpenAIEmbeddingProvider"

[project.entry-points."hiveflow.vector_stores"]
memory = "hiveflow.plugins.vector_stores.memory_store:MemoryVectorStore"

[project.entry-points."hiveflow.publishers"]
json = "hiveflow.plugins.publishers.json_publisher:JSONPublisher"
pdf = "hiveflow.plugins.publishers.pdf_publisher:PDFPublisher"
docx = "hiveflow.plugins.publishers.docx_publisher:DOCXPublisher"
html = "hiveflow.plugins.publishers.html_publisher:HTMLPublisher"

[project.entry-points."hiveflow.document_loaders"]
plain_text = "hiveflow.plugins.documents.plain_text:PlainTextLoader"
markdown = "hiveflow.plugins.documents.markdown_loader:MarkdownLoader"
pdf = "hiveflow.plugins.documents.pdf_loader:PDFLoader"
docx = "hiveflow.plugins.documents.docx_loader:DocxLoader"
pptx = "hiveflow.plugins.documents.pptx_loader:PptxLoader"
excel = "hiveflow.plugins.documents.excel_loader:ExcelLoader"
html = "hiveflow.plugins.documents.html_loader:HTMLLoader"
json = "hiveflow.plugins.documents.json_loader:JSONLoader"
xml = "hiveflow.plugins.documents.xml_loader:XMLLoader"
markitdown = "hiveflow.plugins.documents.markitdown_loader:MarkItDownLoader"

[project.scripts]
hiveflow = "hiveflow.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.8.4",
    "mypy>=1.13.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "B905",  # zip strict parameter
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py
"tests/**/*.py" = ["ARG", "S101"]  # Allow unused args and asserts in tests

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "mcp.*",
    "playwright.*",
    "pymupdf.*",
    "json_repair.*",
    "fastapi.*",
    "uvicorn.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "hiveflow.api.*"
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--cov=hiveflow",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "-v",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["hiveflow"]
omit = ["tests/*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
